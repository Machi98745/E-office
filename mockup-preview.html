    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return JSON.parse(JSON.stringify(INITIAL_STATE));
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      render();
    }

    function nowThai() {
      const d = new Date();
      return `${d.getDate()} พ.ย. 2569 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function getStatusBadge(status) {
      const map = {
        "Draft": { label: "ฉบับร่าง (Draft)", dot: "bg-slate-400", cls: "bg-slate-100 text-slate-700 border-slate-300" },
        "Pending Clerk": { label: "รอสารบรรณออกเลข", dot: "bg-amber-500", cls: "bg-amber-50 text-amber-800 border-amber-300" },
        "Pending Approval": { label: "รอผู้บริหารอนุมัติ", dot: "bg-blue-500", cls: "bg-blue-50 text-blue-800 border-blue-300" },
        "Returned for Revision": { label: "ส่งกลับแก้ไข", dot: "bg-orange-500", cls: "bg-orange-50 text-orange-800 border-orange-300" },
        "Approved": { label: "อนุมัติแล้ว", dot: "bg-emerald-500", cls: "bg-emerald-50 text-emerald-800 border-emerald-300" },
        "Rejected": { label: "ไม่อนุมัติ", dot: "bg-rose-500", cls: "bg-rose-50 text-rose-800 border-rose-300" }
      };
      return map[status] || { label: status, dot: "bg-slate-400", cls: "bg-slate-100 text-slate-700" };
    }

    function nextId(items, prefix) {
      const maxNum = items.reduce((max, item) => {
        const match = String(item.id).match(/(\d+)$/);
        const num = match ? parseInt(match[1], 10) : 0;
        return num > max ? num : max;
      }, 0);
      return `${prefix}-${String(maxNum + 1).padStart(3, "0")}`;
    }

    window.loginRole = (role) => { state.currentRole = role; state.isAuthenticated = true; saveState(); };
    window.logoutApp = () => { state.isAuthenticated = false; saveState(); };

      const days = Number(document.getElementById("newLeaveDays").value || 1);

      if (endDate < startDate) {
        alert("วันที่สิ้นสุดการลาต้องไม่น้อยกว่าวันที่เริ่มต้นการลา");

      const bal = state.leaveBalance[lv.leaveType];
      const remaining = bal.total - bal.used;
      if (lv.days > remaining) {
        alert(`ไม่สามารถอนุมัติได้เนื่องจากวันลาคงเหลือไม่พอ (คงเหลือ ${remaining} วัน)`);
        return;
      }
      lv.status = "Approved";
      lv.approverComment = "อนุมัติการลา และตัดโควตาวันลาอัตโนมัติ";
      lv.auditTrail = lv.auditTrail || [];

        timestamp: nowThai(),
        actorName: ACTORS.approver.name,
        actorRole: "approver",
        action: `อนุมัติใบลาและหักโควตาวันลา ${lv.days} วันอัตโนมัติ (Approved)`,

      state.leaveBalance[lv.leaveType].used = Math.min(bal.total, bal.used + lv.days);

                    { r: "approver", step: "3", label: "ผู้อำนวยการอนุมัติ", cls: "bg-emerald-600 text-white ring-2 ring-emerald-300" }
                  ].map((item, idx) => {
                    const sel = state.currentRole === item.r;
                    const cnt = counts[item.r];
                    return `
                      <button onclick="switchRole('${item.r}')" class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold transition ${sel ? item.cls : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                        <span class="w-5 h-5 rounded-full flex items-center justify-center text-[11px] ${sel ? 'bg-white/25 text-white' : 'bg-white text-slate-700'}">${item.step}</span>
                        <span>${item.label}</span>
                        ${cnt > 0 ? `<span class="px-1.5 py-0.5 rounded-full text-[10px] font-bold ${sel ? 'bg-white text-slate-900' : 'bg-rose-500 text-white'}">${cnt}</span>` : ''}
                      </button>
                      ${idx < 2 ? `<span class="text-slate-400 text-xs">➔</span>` : ''}
                    `;
                  }).join("")}
                </div>
              </div>

              ${state.toast ? `
                <div class="bg-emerald-900 text-white px-6 py-2.5 border-t border-emerald-700 flex flex-wrap items-center justify-between gap-3">
                  <div class="text-xs font-medium">✅ ${state.toast.message}</div>
                  <div class="flex items-center gap-2">
                    ${state.toast.nextRole ? `
                      <button onclick="switchRole('${state.toast.nextRole}')" class="px-3 py-1 rounded-lg bg-white text-emerald-950 text-xs font-bold hover:bg-emerald-50 shadow-sm">
                        ${state.toast.nextLabel}
                      </button>
                    ` : ''}
                    <button onclick="closeToast()" class="text-emerald-200 hover:text-white text-xs font-bold px-2">✕</button>
                  </div>
                </div>
              ` : ''}
            </header>

            <main class="flex-1 max-w-6xl w-full mx-auto px-6 py-6 no-print">
              ${state.activeTab === "dashboard" ? renderDashboard(actor, counts) : ""}
              ${state.activeTab === "memos" ? renderMemos(selectedMemo, actor) : ""}
              ${state.activeTab === "leaves" ? renderLeaves() : ""}
              ${state.activeTab === "bookings" ? renderBookings() : ""}
              ${state.activeTab === "announcements" ? renderAnnouncements() : ""}
              ${state.activeTab === "architecture" ? renderArchitecture() : ""}
            </main>
          </div>
        </div>

        ${state.showPrintModal ? renderPrintModal(selectedMemo) : ""}
        ${state.showNewMemoModal ? renderNewMemoModal() : ""}
      `;
    }

    function renderDashboard(actor, counts) {
      const inboxMemos = state.memos.filter(m =>
        state.currentRole === "requester" ? (m.status === "Draft" || m.status === "Returned for Revision") :
        state.currentRole === "clerk" ? m.status === "Pending Clerk" :
        m.status === "Pending Approval"
      );

      return `
        <div class="space-y-6">
          <div class="bg-gradient-to-r from-indigo-600 via-blue-600 to-indigo-700 rounded-3xl p-7 text-white shadow-md flex flex-wrap items-center justify-between gap-6">
            <div class="space-y-2 max-w-2xl">
              <div class="inline-block px-3 py-1 rounded-full bg-white/15 text-xs font-semibold">มุมมองปัจจุบัน: ${actor.title}</div>
              <h2 class="text-2xl font-bold">สวัสดีคุณ${actor.name}</h2>
              <p class="text-sm text-indigo-100">${actor.description}</p>
            </div>
            <div class="flex gap-3">
              <button onclick="switchRole('requester'); toggleNewMemo(true)" class="px-5 py-3 rounded-2xl bg-white text-indigo-700 font-bold text-xs shadow-md hover:bg-indigo-50">+ สร้างบันทึกข้อความใหม่</button>
              <button onclick="switchTab('architecture')" class="px-4 py-3 rounded-2xl bg-white/15 border border-white/25 text-white font-semibold text-xs hover:bg-white/25">เปิดสไลด์ Flow & Stack</button>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <div class="text-xs font-bold text-slate-500">งานในกล่องงานของคุณ</div>
              <div class="text-3xl font-bold text-slate-900 mt-3">${counts[state.currentRole]} <span class="text-sm font-medium text-slate-500">รายการ</span></div>
            </div>
            <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <div class="text-xs font-bold text-slate-500">รอสารบรรณออกเลข</div>
              <div class="text-3xl font-bold text-slate-900 mt-3">${state.memos.filter(m => m.status === 'Pending Clerk').length} <span class="text-sm font-medium text-slate-500">เรื่อง</span></div>
            </div>
            <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <div class="text-xs font-bold text-slate-500">รอผู้บริหารอนุมัติ</div>
              <div class="text-3xl font-bold text-slate-900 mt-3">${counts.approver} <span class="text-sm font-medium text-slate-500">รายการ</span></div>
            </div>
            <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
              <div class="text-xs font-bold text-slate-500">อนุมัติเสร็จสมบูรณ์</div>
              <div class="text-3xl font-bold text-slate-900 mt-3">${state.memos.filter(m => m.status === 'Approved').length + state.leaves.filter(l => l.status === 'Approved').length} <span class="text-sm font-medium text-slate-500">รายการ</span></div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
              <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                <h3 class="font-bold text-sm text-slate-900">งานที่รอคุณดำเนินการตอนนี้ (${inboxMemos.length})</h3>
              </div>
              <div class="divide-y divide-slate-100">
                ${inboxMemos.length === 0 ? `<div class="p-10 text-center text-xs text-slate-500">ไม่มีงานค้างในบทบาทนี้ กดปุ่มสลับมุมมอง <strong>1 → 2 → 3</strong> ด้านบนขวาเพื่อไปตรวจหรืออนุมัติงานในขั้นถัดไปได้ทันที</div>` : ""}
                ${inboxMemos.map(m => {
                  const b = getStatusBadge(m.status);
                  return `
                    <div class="p-5 hover:bg-slate-50 transition flex flex-wrap items-center justify-between gap-4">
                      <div class="space-y-1">
                        <div class="flex items-center gap-2">
                          <span class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-indigo-50 text-indigo-700">${m.documentNumber || m.id}</span>
                          <span class="text-[11px] px-2.5 py-0.5 rounded-full border font-semibold ${b.cls}">${b.label}</span>
                        </div>
                        <div class="font-bold text-sm text-slate-900">${m.subject}</div>
                        ${m.revisionNote ? `<div class="text-xs text-orange-800 bg-orange-50 border border-orange-200 rounded-xl px-3 py-1.5">สิ่งที่ต้องแก้ไข: ${m.revisionNote}</div>` : ""}
                      </div>
                      <button onclick="selectMemo('${m.id}')" class="px-4 py-2.5 rounded-2xl bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 shadow-sm">
                        เปิดดำเนินการ ➔
                      </button>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>

            <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 space-y-3">
              <h3 class="font-bold text-sm text-slate-900">💡 วิธีสาธิต Flow ง่ายๆ ใน 3 คลิก</h3>
              <div onclick="switchRole('requester')" class="p-3.5 rounded-2xl bg-blue-50/70 border border-blue-200 text-xs cursor-pointer">
                <div class="font-bold text-blue-900">1. พนักงานยื่นเรื่อง (Requester)</div>
                <div class="text-slate-600 mt-0.5">สร้างบันทึกข้อความใหม่ หรือส่งงานที่แก้ไขแล้วเข้าห้องสารบรรณ</div>
              </div>
              <div onclick="switchRole('clerk')" class="p-3.5 rounded-2xl bg-amber-50/70 border border-amber-200 text-xs cursor-pointer">
                <div class="font-bold text-amber-900">2. สารบรรณออกเลข (Clerk)</div>
                <div class="text-slate-600 mt-0.5">ตรวจรูปแบบและกดออกเลขทะเบียนหนังสือราชการ <code>บค xxx/2569</code></div>
              </div>
              <div onclick="switchRole('approver')" class="p-3.5 rounded-2xl bg-emerald-50/70 border border-emerald-200 text-xs cursor-pointer">
                <div class="font-bold text-emerald-900">3. ผู้อำนวยการอนุมัติ (Approver)</div>
                <div class="text-slate-600 mt-0.5">กดลงนาม <code>e-Signature</code> แล้วกดปุ่มพิมพ์หนังสือราชการ PDF</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderMemos(selectedMemo, actor) {
      const b = getStatusBadge(selectedMemo.status);
      const filtered = state.memos.filter(m => state.statusFilter === "ALL" || m.status === state.statusFilter);
      return `
        <div class="space-y-5">
          <div class="bg-white p-4 rounded-3xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap gap-1.5">
              ${[
                { k: "ALL", l: "ทั้งหมด" },
                { k: "Pending Clerk", l: "รอสารบรรณออกเลข" },
                { k: "Pending Approval", l: "รอผู้บริหารอนุมัติ" },
                { k: "Returned for Revision", l: "ส่งกลับแก้ไข" },
                { k: "Approved", l: "อนุมัติแล้ว" }
              ].map(f => `
                <button onclick="setFilter('${f.k}')" class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${state.statusFilter === f.k ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${f.l}</button>
              `).join("")}
            </div>
            <button onclick="toggleNewMemo(true)" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 shadow-sm">+ สร้างบันทึกข้อความใหม่</button>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-5 bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
              <div class="px-5 py-3.5 bg-slate-50 border-b border-slate-100 text-xs font-bold text-slate-700">รายการหนังสือบันทึกข้อความ (${filtered.length})</div>
              <div class="divide-y divide-slate-100">
                ${filtered.map(m => {
                  const mb = getStatusBadge(m.status);
                  return `
                    <button onclick="selectMemo('${m.id}')" class="w-full text-left p-4 block transition ${m.id === selectedMemo.id ? 'bg-indigo-50/80 border-l-4 border-l-indigo-600' : 'hover:bg-slate-50'}">
                      <div class="flex items-center justify-between gap-2 mb-1">
                        <span class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-white border border-slate-200 text-indigo-700">${m.documentNumber || m.id}</span>
                        <span class="text-[10px] px-2.5 py-0.5 rounded-full border font-bold ${mb.cls}">${mb.label}</span>
                      </div>
                      <div class="text-sm font-bold text-slate-900">${m.subject}</div>
                      <div class="text-[11px] text-slate-500 mt-1">${m.category} • ${m.updatedAt}</div>
                    </button>
                  `;
                }).join("")}
              </div>
            </div>

            <div class="lg:col-span-7 space-y-4">
              <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <span class="text-xs font-bold text-slate-800">สถานะการเดินเอกสาร (Workflow Progress)</span>
                  <button onclick="togglePrint(true)" class="px-3.5 py-2 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-slate-800 shadow-sm">🖨️ พิมพ์หนังสือราชการ / PDF</button>
                </div>
                <div class="grid grid-cols-4 gap-2 text-center text-xs">
                  <div class="p-3 rounded-2xl border ${selectedMemo.status === 'Draft' || selectedMemo.status === 'Returned for Revision' ? 'bg-indigo-600 text-white font-bold' : 'bg-emerald-50 border-emerald-200 text-emerald-900'}">1. ยื่นเรื่อง<br/><span class="text-[10px] opacity-80">Requester</span></div>
                  <div class="p-3 rounded-2xl border ${selectedMemo.status === 'Pending Clerk' ? 'bg-indigo-600 text-white font-bold' : selectedMemo.documentNumber ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-slate-50 text-slate-400'}">2. ออกเลขหนังสือ<br/><span class="text-[10px] opacity-80">${selectedMemo.documentNumber || 'Clerk'}</span></div>
                  <div class="p-3 rounded-2xl border ${selectedMemo.status === 'Pending Approval' ? 'bg-indigo-600 text-white font-bold' : selectedMemo.status === 'Approved' ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-slate-50 text-slate-400'}">3. พิจารณาลงนาม<br/><span class="text-[10px] opacity-80">Approver</span></div>
                  <div class="p-3 rounded-2xl border ${selectedMemo.status === 'Approved' ? 'bg-emerald-100 border-emerald-400 text-emerald-900 font-bold' : selectedMemo.status === 'Rejected' ? 'bg-rose-100 border-rose-400 text-rose-900 font-bold' : 'bg-slate-50 text-slate-400'}">4. เสร็จสมบูรณ์<br/><span class="text-[10px] opacity-80">e-Signature</span></div>
                </div>
              </div>

              <!-- Action Box -->
              <div class="bg-white rounded-3xl border-2 border-indigo-200 shadow-sm p-5 space-y-3">
                <div class="font-bold text-sm text-slate-900">การดำเนินการในขั้นตอนนี้ (${actor.title})</div>
                ${state.currentRole === "clerk" && selectedMemo.status === "Pending Clerk" ? `
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <input id="clerkDocNo" placeholder="เลขทะเบียน (อัตโนมัติ: บค ${String(state.docRunningNumber).padStart(3,'0')}/2569)" class="px-3.5 py-2 text-xs rounded-xl border border-slate-300" />
                    <input id="actionComment" placeholder="ความเห็นสารบรรณ / เหตุผลที่ตีกลับ" class="px-3.5 py-2 text-xs rounded-xl border border-slate-300" />
                  </div>
                  <div class="flex flex-wrap gap-2">
                    <button onclick="clerkIssueNumber('${selectedMemo.id}')" class="px-4 py-2.5 rounded-2xl bg-amber-600 text-white text-xs font-bold hover:bg-amber-700 shadow-sm">ออกเลขทะเบียนหนังสือ & ส่งต่อผู้อำนวยการ</button>
                    <button onclick="returnMemo('${selectedMemo.id}')" class="px-4 py-2.5 rounded-2xl bg-orange-100 text-orange-800 border border-orange-300 text-xs font-bold">ส่งกลับให้แก้ไข (Return)</button>
                  </div>
                ` : state.currentRole === "approver" && selectedMemo.status === "Pending Approval" ? `
                  <input id="actionComment" placeholder="คำสั่งการผู้บริหารท้ายบันทึกข้อความ..." class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-300" />
                  <div class="flex flex-wrap gap-2">
                    <button onclick="approveMemoAction('${selectedMemo.id}')" class="px-5 py-2.5 rounded-2xl bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700 shadow-sm">✍️ ลงนามอนุมัติ (e-Signature Approve)</button>
                    <button onclick="returnMemo('${selectedMemo.id}')" class="px-3.5 py-2.5 rounded-2xl bg-orange-100 text-orange-800 border border-orange-300 text-xs font-bold">ส่งกลับแก้ไข</button>
                    <button onclick="rejectMemoAction('${selectedMemo.id}')" class="px-3.5 py-2.5 rounded-2xl bg-rose-100 text-rose-800 border border-rose-300 text-xs font-bold">ไม่อนุมัติ (Reject)</button>
                  </div>
                ` : state.currentRole === "requester" && (selectedMemo.status === "Returned for Revision" || selectedMemo.status === "Draft") ? `
                  <button onclick="resubmitMemoAction('${selectedMemo.id}')" class="px-5 py-2.5 rounded-2xl bg-blue-600 text-white text-xs font-bold hover:bg-blue-700 shadow-sm">ส่งเรื่องให้สารบรรณตรวจสอบทันที</button>
                ` : `
                  <div class="text-xs text-indigo-950 bg-indigo-50 p-3.5 rounded-2xl border border-indigo-200 flex flex-wrap items-center justify-between gap-2">
                    <span>เอกสารนี้อยู่ระหว่างรอ <strong>${b.label}</strong></span>
                    ${selectedMemo.status === "Pending Clerk" ? `<button onclick="switchRole('clerk')" class="px-3.5 py-2 rounded-xl bg-amber-600 text-white font-bold">สลับเป็น 2. สารบรรณ (Clerk) ➔</button>` : ""}
                    ${selectedMemo.status === "Pending Approval" ? `<button onclick="switchRole('approver')" class="px-3.5 py-2 rounded-xl bg-emerald-600 text-white font-bold">สลับเป็น 3. ผู้อำนวยการ (Approver) ➔</button>` : ""}
                    ${selectedMemo.status === "Returned for Revision" || selectedMemo.status === "Draft" ? `<button onclick="switchRole('requester')" class="px-3.5 py-2 rounded-xl bg-blue-600 text-white font-bold">สลับเป็น 1. พนักงานผู้ยื่น (Requester) ➔</button>` : ""}
                  </div>
                `}
              </div>

              <!-- Document Content -->
              <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 space-y-4">
                <div class="flex justify-between items-start border-b border-slate-200 pb-4">
                  <div>
                    <span class="text-xs text-indigo-600 font-bold">บันทึกข้อความ (OFFICIAL MEMORANDUM) • ${selectedMemo.category}</span>
                    <h3 class="text-lg font-bold text-slate-900 mt-1">${selectedMemo.subject}</h3>
                  </div>
                  <div class="text-right text-xs bg-slate-50 px-3.5 py-2.5 rounded-2xl border border-slate-200">
                    <div><strong>เลขทะเบียน:</strong> <span class="font-mono font-bold text-indigo-700">${selectedMemo.documentNumber || "รอสารบรรณออกเลข"}</span></div>
                    <div><strong>รหัสอ้างอิง:</strong> ${selectedMemo.id}</div>
                  </div>
                </div>
                <div class="text-sm text-slate-800 leading-relaxed bg-slate-50 p-5 rounded-2xl border border-slate-200">${selectedMemo.content}</div>
                ${selectedMemo.attachmentName ? `<div class="text-xs bg-slate-50 p-3.5 rounded-2xl border border-slate-200 flex justify-between"><span>📎 ไฟล์แนบ: <strong>${selectedMemo.attachmentName}</strong></span><span class="text-emerald-700 font-bold">✓ ตรวจสอบไฟล์แนบแล้ว</span></div>` : ""}

                ${selectedMemo.status === "Approved" ? `
                  <div class="p-4 rounded-2xl bg-emerald-50 border-2 border-emerald-300 flex items-center justify-between">
                    <div class="text-xs space-y-1">
                      <div class="font-bold text-emerald-900">✓ ลงนามอนุมัติด้วยลายมือชื่ออิเล็กทรอนิกส์ (Verified Digital e-Signature)</div>
                      <div>คำสั่งการ: “${selectedMemo.approverCommand || 'อนุมัติให้ดำเนินการตามเสนอ'}”</div>
                      <div class="text-slate-500">ผู้ลงนาม: ${selectedMemo.signedBy || ACTORS.approver.name}</div>
                    </div>
                    <div class="px-3.5 py-2 rounded-xl border-2 border-emerald-600 text-emerald-700 font-bold text-xs bg-white">APPROVED • อนุมัติแล้ว</div>
                  </div>
                ` : ""}

                <div class="pt-3 border-t border-slate-200">
                  <h4 class="text-xs font-bold text-slate-700 uppercase mb-2.5">ประวัติการเดินเอกสาร (Audit Trail)</h4>
                  <div class="space-y-2">
                    ${selectedMemo.auditTrail.map((a, idx) => `
                      <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 text-xs">
                        <div class="flex justify-between font-bold text-slate-900">
                          <span>#${idx+1} ${a.actorName} (${a.actorRole})</span>
                          <span class="text-slate-500 font-normal">${a.timestamp}</span>
                        </div>
                        <div class="text-slate-700 mt-0.5">${a.action}</div>
                        ${a.comment ? `<div class="text-slate-600 italic mt-1">“${a.comment}”</div>` : ""}
                      </div>
                    `).join("")}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderLeaves() {
      return `
        <div class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            ${Object.keys(state.leaveBalance).map(k => {
              const q = state.leaveBalance[k];
              return `
                <div class="bg-white rounded-3xl border border-slate-200 p-5 shadow-sm">
                  <div class="flex justify-between text-xs font-bold text-slate-700">
                    <span>${q.label}</span>
                    <span class="px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700">คงเหลือ ${q.total - q.used} วัน</span>
                  </div>
                  <div class="text-2xl font-bold text-slate-900 mt-2">ใช้ไป ${q.used} / ${q.total} วัน</div>
                </div>
              `;
            }).join("")}
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <form onsubmit="createNewLeave(event)" class="lg:col-span-5 bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-3.5">
              <h4 class="font-bold text-sm text-slate-900">ยื่นใบลาออนไลน์ใหม่ (Direct Approval Flow)</h4>
              <select id="newLeaveType" class="w-full px-3 py-2.5 text-xs rounded-xl border border-slate-300 bg-white">
                <option value="vacation">ลาพักผ่อนประจำปี (Vacation Leave)</option>
                <option value="sick">ลาป่วย (Sick Leave)</option>
                <option value="personal">ลากิจธุระจำเป็น (Personal Leave)</option>
              </select>
              <div class="grid grid-cols-3 gap-2">
                <input id="newLeaveStart" type="date" value="2026-12-01" class="px-2 py-2 text-xs rounded-xl border border-slate-300" />
                <input id="newLeaveEnd" type="date" value="2026-12-02" class="px-2 py-2 text-xs rounded-xl border border-slate-300" />
                <input id="newLeaveDays" type="number" value="2" min="1" class="px-2 py-2 text-xs rounded-xl border border-slate-300" />
              </div>
              <textarea id="newLeaveReason" rows="3" required placeholder="ระบุเหตุผลการลาและผู้รับผิดชอบงานแทน..." class="w-full px-3 py-2 text-xs rounded-xl border border-slate-300"></textarea>
              <button type="submit" class="w-full py-3 rounded-2xl bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700">ส่งใบลาให้หัวหน้าพิจารณาอนุมัติ</button>
            </form>

            <div class="lg:col-span-7 bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
              <div class="flex justify-between items-center">
                <h4 class="font-bold text-sm text-slate-900">รายการใบลาทั้งหมด (${state.leaves.length})</h4>
                ${state.currentRole !== "approver" ? `<button onclick="switchRole('approver')" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-bold">สลับเป็น 3. ผู้อำนวยการ (Approver) เพื่อกดอนุมัติใบลา ➔</button>` : ""}
              </div>
              <div class="divide-y divide-slate-100">
                ${state.leaves.map(l => {
                  const b = getStatusBadge(l.status);
                  return `
                    <div class="py-4 flex flex-wrap items-center justify-between gap-3">
                      <div class="space-y-1 text-xs">
                        <div class="flex items-center gap-2">
                          <span class="font-mono font-bold text-indigo-700">${l.id}</span>
                          <span class="font-bold text-slate-900">${state.leaveBalance[l.leaveType].label} (${l.days} วัน)</span>
                          <span class="px-2.5 py-0.5 rounded-full border font-bold ${b.cls}">${b.label}</span>
                        </div>
                        <div class="text-slate-600">วันที่ลา: ${l.startDate} ถึง ${l.endDate} • เหตุผล: ${l.reason}</div>
                      </div>
                      ${l.status === "Pending Approval" && state.currentRole === "approver" ? `
                        <div class="flex gap-2">
                          <button onclick="approveLeave('${l.id}')" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-bold">อนุมัติ & หักวันลา (${l.days} วัน)</button>
                          <button onclick="rejectLeave('${l.id}')" class="px-3 py-2 rounded-xl bg-rose-100 text-rose-800 border border-rose-300 text-xs font-bold">ไม่อนุมัติ</button>
                        </div>
                      ` : ""}
                    </div>
                  `;
                }).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

                  <div class="p-5 rounded-2xl bg-slate-50 border border-slate-200 space-y-1.5">

    function renderArchitecture() {
      return `
        <div class="space-y-6">
          <div class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 rounded-3xl p-7 text-white shadow-lg space-y-2">
            <span class="px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-400/30 text-xs font-semibold">สไลด์สรุปสำหรับเปิดนำเสนออาจารย์</span>
            <h2 class="text-2xl font-bold">สถาปัตยกรรมระบบ E-Office: การออกแบบ FLOW & STACK</h2>
            <p class="text-sm text-slate-300">เปิดหน้านี้ประกอบการอธิบายอาจารย์ได้เลย สรุปครบทั้ง Workflow State Machine และ Full-Stack Architecture</p>
          </div>

          <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
            <h3 class="text-base font-bold text-slate-900">1. การออกแบบ FLOW (Workflow Routing & State Machine)</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
              <div class="p-4 rounded-2xl bg-blue-50/60 border border-blue-200 space-y-1.5">
                <span class="px-2.5 py-0.5 rounded-full bg-blue-600 text-white font-bold">บทบาทที่ 1: Requester</span>
                <div class="font-bold text-sm text-slate-900 pt-1">พนักงานผู้ยื่นเรื่อง</div>
                <div class="text-slate-600">สร้างร่างบันทึกข้อความ (Draft) แนบไฟล์ PDF และกดส่งเข้าห้องสารบรรณ (Pending Clerk)</div>
              </div>
              <div class="p-4 rounded-2xl bg-amber-50/60 border border-amber-200 space-y-1.5">
                <span class="px-2.5 py-0.5 rounded-full bg-amber-600 text-white font-bold">บทบาทที่ 2: Clerk</span>
                <div class="font-bold text-sm text-slate-900 pt-1">เจ้าหน้าที่สารบรรณกลาง</div>
                <div class="text-slate-600">ตรวจความถูกต้อง ออกเลขทะเบียนหนังสือราชการ (บค xxx/2569) หรือส่งกลับให้แก้ไข</div>
              </div>
              <div class="p-4 rounded-2xl bg-emerald-50/60 border border-emerald-200 space-y-1.5">
                <span class="px-2.5 py-0.5 rounded-full bg-emerald-600 text-white font-bold">บทบาทที่ 3: Approver</span>
                <div class="font-bold text-sm text-slate-900 pt-1">ผู้อำนวยการฝ่าย (ผู้อนุมัติ)</div>
                <div class="text-slate-600">ลงนามอนุมัติด้วยลายมือชื่ออิเล็กทรอนิกส์ (e-Signature) พร้อมออกเอกสาร PDF</div>
              </div>
            </div>
          </div>

          <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
            <h3 class="text-base font-bold text-slate-900">2. การออกแบบ STACK (Full-Stack Architecture)</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
              <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-1.5">
                <div class="font-bold text-indigo-700 text-sm">Frontend & UI Layer</div>
                <div>Next.js 15 (App Router) + React 19 + TypeScript + Tailwind CSS + Lucide Icons</div>
              </div>
              <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-1.5">
                <div class="font-bold text-emerald-700 text-sm">Backend API & Persistence Layer</div>
                <div>Next.js REST API Route (<code>GET / POST /api/eoffice</code>) + Persistent Server JSON DB (<code>data/eoffice-db.json</code>)</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

              </div>
            </form>
          </div>
        </div>
      `;
    }

                  <p class="text-xs text-slate-600">ระบบสารบรรณอิเล็กทรอนิกส์ (E-Office Official Memorandum)</p>

                <div class="border border-slate-400 rounded-xl px-4 py-2 text-xs text-right">

                <div><strong>เรื่อง:</strong> ${memo.subject}</div>

                  ${memo.status === "Approved" ? `
                    <div class="text-emerald-700 font-bold">✓ อนุมัติแล้ว (APPROVED)</div>

    render();
  </script>
