        }

    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return JSON.parse(JSON.stringify(INITIAL_STATE));
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      render();
    }

    function nowThai() {
      const d = new Date();
      return `${d.getDate()} พ.ย. 2569 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function getStatusBadge(status) {
      const map = {
        "Draft": { label: "ฉบับร่าง (Draft)", cls: "bg-slate-100 text-slate-700 border-slate-300" },
        "Pending Clerk": { label: "รอสารบรรณออกเลข (Pending Clerk)", cls: "bg-amber-50 text-amber-800 border-amber-300" },
        "Pending Approval": { label: "รอหัวหน้าอนุมัติ (Pending Approval)", cls: "bg-blue-50 text-blue-800 border-blue-300" },
        "Returned for Revision": { label: "ส่งกลับแก้ไข (Returned for Revision)", cls: "bg-orange-50 text-orange-800 border-orange-300" },
        "Approved": { label: "อนุมัติแล้ว (Approved)", cls: "bg-emerald-50 text-emerald-800 border-emerald-300" },
        "Rejected": { label: "ไม่อนุมัติ (Rejected)", cls: "bg-rose-50 text-rose-800 border-rose-300" }
      };
      return map[status] || { label: status, cls: "bg-slate-100 text-slate-700" };
    }

    // Actions
    window.switchRole = (role) => { state.currentRole = role; saveState(); };
    window.switchTab = (tab) => { state.activeTab = tab; saveState(); };
    window.selectMemo = (id) => { state.selectedMemoId = id; state.activeTab = "memos"; saveState(); };
    window.setFilter = (f) => { state.statusFilter = f; saveState(); };
    window.resetDemo = () => {
      localStorage.removeItem(STORAGE_KEY);
      state = JSON.parse(JSON.stringify(INITIAL_STATE));
      render();
    };

    window.clerkIssueNumber = (memoId) => {
      const customNo = document.getElementById("clerkDocNo")?.value?.trim();
      const comment = document.getElementById("actionComment")?.value?.trim();
      const docNo = customNo || `บค ${String(state.docRunningNumber).padStart(3, "0")}/2569`;
      state.docRunningNumber += 1;
      const m = state.memos.find(x => x.id === memoId);
      if (!m) return;
      m.documentNumber = docNo;
      m.status = "Pending Approval";
      m.updatedAt = nowThai();
      m.revisionNote = undefined;
      m.auditTrail.push({
        timestamp: nowThai(),
        actorName: ACTORS.clerk.name,
        actorRole: "clerk",
        action: `ออกเลขทะเบียน ${docNo} และส่งต่อผู้อนุมัติ`,
        comment: comment || "ตรวจสอบรูปแบบเอกสารและไฟล์แนบถูกต้องครบถ้วน"
      });
      saveState();
    };

    window.returnMemo = (memoId) => {
      const comment = document.getElementById("actionComment")?.value?.trim() || "กรุณาตรวจสอบและแก้ไขรายละเอียดเอกสารเพิ่มเติม";
      const m = state.memos.find(x => x.id === memoId);
      if (!m) return;
      m.status = "Returned for Revision";
      m.revisionNote = comment;
      m.updatedAt = nowThai();
      m.auditTrail.push({
        timestamp: nowThai(),
        actorName: ACTORS[state.currentRole].name,
        actorRole: state.currentRole,
        action: "ส่งกลับให้ผู้ยื่นแก้ไข (Returned for Revision)",
        comment
      });
      saveState();
    };

    window.approveMemoAction = (memoId) => {
      const comment = document.getElementById("actionComment")?.value?.trim() || "อนุมัติให้ดำเนินการตามเสนอ";
      const m = state.memos.find(x => x.id === memoId);
      if (!m) return;
      m.status = "Approved";
      m.revisionNote = undefined;
      m.updatedAt = nowThai();
      m.auditTrail.push({
        timestamp: nowThai(),
        actorName: ACTORS.approver.name,
        actorRole: "approver",
        action: "ลงนามอนุมัติบันทึกข้อความ (Approved)",
        comment
      });
      saveState();
    };

    window.rejectMemoAction = (memoId) => {
      const comment = document.getElementById("actionComment")?.value?.trim() || "ไม่อนุมัติเนื่องจากเกินกรอบงบประมาณ";
      const m = state.memos.find(x => x.id === memoId);
      if (!m) return;
      m.status = "Rejected";
      m.updatedAt = nowThai();
      m.auditTrail.push({
        timestamp: nowThai(),
        actorName: ACTORS.approver.name,
        actorRole: "approver",
        action: "ไม่อนุมัติบันทึกข้อความ (Rejected - ปิดเรื่อง)",
        comment
      });
      saveState();
    };

    window.resubmitMemoAction = (memoId) => {
      const m = state.memos.find(x => x.id === memoId);
      if (!m) return;
      m.status = "Pending Clerk";
      m.revisionNote = undefined;
      m.updatedAt = nowThai();
      m.auditTrail.push({
        timestamp: nowThai(),
        actorName: ACTORS.requester.name,
        actorRole: "requester",
        action: "แก้ไขข้อมูลและส่งเรื่องให้สารบรรณตรวจสอบอีกครั้ง",
        comment: "ปรับปรุงเนื้อหาตามข้อเสนอแนะเรียบร้อยแล้วครับ"
      });
      saveState();
    };

    window.createNewMemo = (e) => {
      e.preventDefault();
      const subject = document.getElementById("newMemoSubject").value.trim();
      const category = document.getElementById("newMemoCategory").value;
      const urgency = document.getElementById("newMemoUrgency").value;
      const budget = document.getElementById("newMemoBudget").value;
      const content = document.getElementById("newMemoContent").value.trim();
      if (!subject || !content) return;
      const newId = `MEMO-${String(state.memos.length + 1).padStart(3, "0")}`;
      const newMemo = {
        id: newId,
        subject,
        category,
        urgency,
        to: "ผู้อำนวยการฝ่ายพัฒนาระบบดิจิทัล",
        requesterName: ACTORS.requester.name,
        department: ACTORS.requester.department,
        createdAt: nowThai(),
        updatedAt: nowThai(),
        content,
        attachmentName: "เอกสารแนบประกอบการพิจารณา.pdf",
        budgetAmount: budget ? Number(budget) : undefined,
        status: "Pending Clerk",
        auditTrail: [
          { timestamp: nowThai(), actorName: ACTORS.requester.name, actorRole: "requester", action: "สร้างและส่งบันทึกข้อความเข้าสู่ห้องสารบรรณ (Pending Clerk)" }
        ]
      };
      state.memos.unshift(newMemo);
      state.selectedMemoId = newId;
      state.activeTab = "memos";
      saveState();
    };

    window.createNewLeave = (e) => {
      e.preventDefault();
      const leaveType = document.getElementById("newLeaveType").value;
      const startDate = document.getElementById("newLeaveStart").value;
      const endDate = document.getElementById("newLeaveEnd").value;
      const days = Number(document.getElementById("newLeaveDays").value || 1);
      const reason = document.getElementById("newLeaveReason").value.trim();
      if (!reason) return;
      state.leaves.unshift({
        id: `LEAVE-${String(state.leaves.length + 1).padStart(3, "0")}`,
        requesterName: ACTORS.requester.name,
        department: ACTORS.requester.department,
        leaveType,
        startDate,
        endDate,
        days,
        reason,
        status: "Pending Approval"
      });
      saveState();
    };

    window.approveLeave = (id) => {
      const lv = state.leaves.find(x => x.id === id);
      if (!lv || lv.status === "Approved") return;
      lv.status = "Approved";
      lv.approverComment = "อนุมัติการลา และตัดโควตาวันลาอัตโนมัติ";
      state.leaveBalance[lv.leaveType].used += lv.days;
      saveState();
    };

    function render() {
      const actor = ACTORS[state.currentRole];
      const counts = {
        requester: state.memos.filter(m => m.status === "Draft" || m.status === "Returned for Revision").length,
        clerk: state.memos.filter(m => m.status === "Pending Clerk").length,

              </select>
              <div class="grid grid-cols-3 gap-2">
                <input id="newLeaveStart" type="date" value="2026-12-01" class="px-2 py-2 text-xs rounded-lg border border-slate-300" />
                <input id="newLeaveEnd" type="date" value="2026-12-02" class="px-2 py-2 text-xs rounded-lg border border-slate-300" />
                <input id="newLeaveDays" type="number" value="2" min="1" class="px-2 py-2 text-xs rounded-lg border border-slate-300" />
              </div>
              <textarea id="newLeaveReason" rows="2" required placeholder="ระบุเหตุผลการลา..." class="w-full px-3 py-2 text-xs rounded-lg border border-slate-300"></textarea>
              <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-semibold">ส่งใบลาให้หัวหน้าอนุมัติ</button>
            </form>

            <div class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-5 space-y-3">
              <div class="flex justify-between items-center">
                <h4 class="font-bold text-sm text-slate-900">รายการใบลาทั้งหมด (${state.leaves.length})</h4>
                ${state.currentRole !== "approver" ? `<button onclick="switchRole('approver')" class="px-3 py-1 rounded-lg bg-emerald-600 text-white text-xs font-semibold">สลับเป็น ผู้อนุมัติ (Approver) เพื่อกดอนุมัติใบลา</button>` : ""}
              </div>
              <div class="divide-y divide-slate-100">
                ${state.leaves.map(l => {
                  const b = getStatusBadge(l.status);
                  return `
                    <div class="py-3.5 flex flex-wrap items-center justify-between gap-3">
                      <div class="space-y-1 text-xs">
                        <div class="flex items-center gap-2">
                          <span class="font-mono font-bold text-indigo-600">${l.id}</span>
                          <span class="font-bold text-slate-900">${state.leaveBalance[l.leaveType].label} (${l.days} วัน)</span>
                          <span class="px-2 py-0.5 rounded-full border ${b.cls}">${b.label}</span>
                        </div>
                        <div class="text-slate-600">ช่วงวันที่: ${l.startDate} ถึง ${l.endDate} • เหตุผล: ${l.reason}</div>
                      </div>
                      ${l.status === "Pending Approval" && state.currentRole === "approver" ? `
                        <button onclick="approveLeave('${l.id}')" class="px-3.5 py-2 rounded-xl bg-emerald-600 text-white text-xs font-semibold">อนุมัติ & หักวันลา (${l.days} วัน)</button>
                      ` : ""}
                    </div>
                  `;
                }).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderArchitecture() {
      return `
        <div class="bg-white rounded-2xl border border-slate-200 p-6 space-y-6">
          <div>
            <h2 class="text-lg font-bold text-slate-900">สรุปสถาปัตยกรรม Flow & Stack ของระบบ E-Office (สำหรับนำเสนออาจารย์)</h2>
            <p class="text-xs text-slate-500">เปรียบเทียบความแตกต่างของ Flow งานสารบรรณ vs งานบุคคล และเปรียบเทียบ Prototype Stack vs Enterprise Stack</p>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
            <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
              <div class="font-bold text-indigo-700 text-sm">1. FLOW: ระบบสารบรรณ & บันทึกข้อความ (3-Role State Machine)</div>
              <div>• <strong>Requester (พนักงาน):</strong> สร้างบันทึกข้อความ (<code>Draft</code>) → ส่งเรื่องเข้าสารบรรณ (<code>Pending Clerk</code>)</div>
              <div>• <strong>Clerk (เจ้าหน้าที่สารบรรณ):</strong> ตรวจสอบรูปแบบ ออกเลขทะเบียนหนังสือ (<code>บค xxx/2569</code>) → ส่งต่อผู้บริหาร (<code>Pending Approval</code>) หรือตีกลับให้แก้ไข (<code>Returned for Revision</code>)</div>
              <div>• <strong>Approver (ผู้อำนวยการฝ่าย):</strong> พิจารณาลงนามอนุมัติ (<code>Approved</code>) หรือไม่อนุมัติ (<code>Rejected</code>) พร้อมบันทึก <code>Audit Trail</code></div>
            </div>
            <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
              <div class="font-bold text-emerald-700 text-sm">2. STACK: ชุดเทคโนโลยี (Prototype vs Production)</div>
              <div>• <strong>Frontend & UI:</strong> Next.js (React + TypeScript) + Tailwind CSS + Lucide Icons</div>
              <div>• <strong>Workflow State Engine:</strong> React Context State Machine + <code>localStorage</code> (Production ใช้ PostgreSQL + Prisma ORM)</div>
              <div>• <strong>Multi-Role Demo Mechanism:</strong> Instant Role Switcher Bar ให้สลับบทบาทสาธิต Flow ได้ในหน้าจอเดียว (บันทึกใน ADR-0001)</div>
            </div>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
