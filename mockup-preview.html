    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return JSON.parse(JSON.stringify(INITIAL_STATE));
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      render();
    }

    function nowThai() {
      const d = new Date();
      return `${d.getDate()} พ.ย. 2569 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function getStatusBadge(status) {
      const map = {
        "Draft": { label: "ฉบับร่าง (Draft)", cls: "bg-slate-100 text-slate-700 border-slate-300" },
        "Pending Clerk": { label: "รอสารบรรณออกเลข (Pending Clerk)", cls: "bg-amber-50 text-amber-800 border-amber-300" },
        "Pending Approval": { label: "รอหัวหน้าอนุมัติ (Pending Approval)", cls: "bg-blue-50 text-blue-800 border-blue-300" },
        "Returned for Revision": { label: "ส่งกลับแก้ไข (Returned for Revision)", cls: "bg-orange-50 text-orange-800 border-orange-300" },
        "Approved": { label: "อนุมัติแล้ว (Approved)", cls: "bg-emerald-50 text-emerald-800 border-emerald-300" },
        "Rejected": { label: "ไม่อนุมัติ (Rejected)", cls: "bg-rose-50 text-rose-800 border-rose-300" }
      };
      return map[status] || { label: status, cls: "bg-slate-100 text-slate-700" };
    }

    window.loginRole = (role) => { state.currentRole = role; state.isAuthenticated = true; saveState(); };
    window.logoutApp = () => { state.isAuthenticated = false; saveState(); };
    window.switchRole = (role) => { state.currentRole = role; saveState(); };
    window.switchTab = (tab) => { state.activeTab = tab; saveState(); };
    window.selectMemo = (id) => { state.selectedMemoId = id; state.activeTab = "memos"; saveState(); };
    window.togglePrint = (show) => { state.showPrintModal = show; saveState(); };
    window.resetDemo = () => {
      localStorage.removeItem(STORAGE_KEY);
      state = JSON.parse(JSON.stringify(INITIAL_STATE));
      render();
    };

    window.clerkIssueNumber = (memoId) => {

      const comment = document.getElementById("actionComment")?.value?.trim();
      const docNo = customNo || `บค ${String(state.docRunningNumber).padStart(3, "0")}/2569`;
      state.docRunningNumber += 1;
      const m = state.memos.find(x => x.id === memoId);
      if (!m) return;
      m.documentNumber = docNo;
      m.status = "Pending Approval";
      m.updatedAt = nowThai();
      m.revisionNote = undefined;
      m.auditTrail.push({
        timestamp: nowThai(),
        actorName: ACTORS.clerk.name,
        actorRole: "clerk",
        action: `ออกเลขทะเบียน ${docNo} และส่งต่อผู้อนุมัติ`,
        comment: comment || "ตรวจสอบรูปแบบเอกสารและไฟล์แนบถูกต้องครบถ้วน"
      });
      saveState();
    };

    function renderArchitecture() {
      return `
        <div class="bg-white rounded-2xl border border-slate-200 p-6 space-y-6">

            <h2 class="text-lg font-bold text-slate-900">สไลด์สรุปสถาปัตยกรรม Flow & Stack ของระบบ E-Office (สำหรับนำเสนออาจารย์)</h2>
            <p class="text-xs text-slate-500">เปิดหน้านี้ขึ้นจอโปรเจกเตอร์เพื่ออธิบายอาจารย์ได้เลย ครอบคลุมทั้ง Business Workflow State Machine และ Full-Stack Architecture</p>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
            <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
              <div class="font-bold text-indigo-700 text-sm">1. FLOW: ระบบสารบรรณ & อนุมัติเอกสาร (State Machine)</div>
              <div>• <strong>Requester (พนักงาน):</strong> สร้างบันทึกข้อความ แนบไฟล์ → ส่งเข้าสารบรรณ (<code>Pending Clerk</code>)</div>
              <div>• <strong>Clerk (เจ้าหน้าที่สารบรรณ):</strong> ตรวจสอบรูปแบบ ออกเลขทะเบียนหนังสือ (<code>บค xxx/2569</code>) → ส่งต่อผู้บริหาร (<code>Pending Approval</code>) หรือตีกลับให้แก้ไข (<code>Returned for Revision</code>)</div>
              <div>• <strong>Approver (ผู้อำนวยการฝ่าย):</strong> ลงนามอนุมัติด้วยลายมือชื่ออิเล็กทรอนิกส์ (<code>e-Signature Approved</code>) พร้อมออกรายงานหนังสือราชการ PDF</div>
              <div>• <strong>e-Leave Flow:</strong> วิ่งตรง <code>Requester → Approver</code> และหักโควตาวันลาอัตโนมัติ</div>
            </div>
            <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
              <div class="font-bold text-emerald-700 text-sm">2. STACK: สถาปัตยกรรมเทคโนโลยี (Full-Stack Architecture)</div>
              <div>• <strong>Frontend Layer:</strong> Next.js 15 (App Router) + React 19 + TypeScript + Tailwind CSS</div>
              <div>• <strong>Backend API Layer:</strong> Next.js REST Route Handler (<code>GET / POST /api/eoffice</code>)</div>
              <div>• <strong>Database Layer:</strong> Server-Side Persistent JSON DB (<code>data/eoffice-db.json</code>) + LocalStorage Fallback</div>
              <div>• <strong>Security & RBAC:</strong> ระบบ Login ตามสิทธิ์ 3 บทบาท + Instant Role Switcher สำหรับสาธิต</div>
            </div>
          </div>
        </div>
      `;
